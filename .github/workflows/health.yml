# 소스 건강 점검.
#
# 중고나라가 하루 종일 39% 였는데 아무도 몰랐다 — 사람이 /status 를 봐야만 알 수 있었다.
# 이 워크플로우는 나쁘면 실패로 끝나고, GitHub 이 저장소 주인에게 메일을 보낸다.
# 알림 채널을 새로 만들지 않고 이미 있는 것을 쓴다.
name: 소스 건강 점검

on:
  schedule:
    # 예열(0,6,12,18시)이 끝난 뒤를 본다. 갓 돌린 결과라야 판단이 유효하다.
    - cron: '40 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: 소스 성공률 점검
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 없으면 조용히 넘어간다. 알림이 없다고 점검이 실패하면 안 된다.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        # 최근 6시간 성공률이 50% 아래면 실패. 표본 20건 미만은 판단 보류.
        run: npm run health -w @eodi/crawler -- --hours=6 --danger=50 --warn=80

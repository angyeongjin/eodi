name: 키워드 알림 발송

# 저장된 검색을 돌려 새 매물만 골라 웹 푸시로 보낸다.
# 앱도, 상주 서버도, 유료 알림 서비스도 없이 돌아간다.
on:
  schedule:
    # 2시간마다. 중고 매물은 분 단위로 다투지만, 그보다 잦으면 소스에 부담이고 사용자에게도 성가시다.
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '한 번에 확인할 알림 수'
        default: '150'
      dry_run:
        description: '발송 없이 확인만'
        type: boolean
        default: false

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:libs

      - name: 알림 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          EODI_UA: ${{ vars.EODI_UA }}
        run: |
          npm run run-alerts -w @eodi/crawler -- \
            --limit=${{ github.event.inputs.limit || '150' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
